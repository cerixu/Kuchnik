name: Temporary Adobe SVG import fix 1.4.44

on:
  push:
    branches:
      - fix/food-svg-padding-1.4.44
    paths:
      - .github/workflows/_import-adobe-svg.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/food-svg-padding-1.4.44
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import square-framed SVG artwork from Adobe
        env:
          RAMEN_URL: https://to.adobe.com/1g8LZFIoMA7rE55Y
          SUSHI_URL: https://to.adobe.com/Jgg89ujOazw3lVB9
          PANNA_URL: https://to.adobe.com/ZcVWoFuB6OC0wsZ5
        shell: bash
        run: |
          set -euo pipefail
          declare -A urls=(
            [ramen-tonkotsu.svg]="$RAMEN_URL"
            [sushi-maki.svg]="$SUSHI_URL"
            [panna-cotta.svg]="$PANNA_URL"
          )
          for name in "${!urls[@]}"; do
            file="assets/food-svg/$name"
            tmp="$file.download"
            echo "Downloading square-framed $name"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 "${urls[$name]}" --output "$tmp"
            test -s "$tmp"
            if ! grep -q '<svg' "$tmp"; then
              echo "Not an SVG: $name"
              head -c 300 "$tmp"
              exit 1
            fi
            npx --yes svgo@3.3.2 --multipass --precision=1 --input="$tmp" --output="$file"
            rm -f "$tmp"
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const items = [
            ['ramen-tonkotsu.svg', 'Ramen tonkotsu', 'Kremowy bulion wieprzowy z makaronem, chashu, jajkiem ajitama, nori i szczypiorem.'],
            ['sushi-maki.svg', 'Sushi maki z łososiem i ogórkiem', 'Sześć rolek maki z łososiem, ogórkiem, ryżem i nori.'],
            ['panna-cotta.svg', 'Panna cotta waniliowa z malinami', 'Jedwabista panna cotta z malinowym coulis, świeżymi malinami i listkiem mięty.'],
          ];
          for (const [name, title, desc] of items) {
            const file = 'assets/food-svg/' + name;
            let svg = fs.readFileSync(file, 'utf8').replace(/^\uFEFF/, '');
            const root = svg.match(/<svg\b[^>]*>/i);
            if (!root) throw new Error(name + ': missing root SVG element');
            let tag = root[0].replace(/\s+role=(["']).*?\1/gi, '').replace(/\s+aria-labelledby=(["']).*?\1/gi, '');
            if (!/\bviewBox=/i.test(tag)) tag = tag.replace(/>$/, ' viewBox="0 0 1024 1024">');
            const viewBox = tag.match(/\bviewBox=(["'])(.*?)\1/i)?.[2]?.trim().split(/[ ,]+/).map(Number);
            if (!viewBox || viewBox.length !== 4 || viewBox[2] <= 0 || viewBox[3] <= 0 || Math.abs(viewBox[2] - viewBox[3]) > 0.01) throw new Error(name + ': invalid square viewBox');
            tag = tag.replace(/>$/, ' role="img" aria-labelledby="title desc">');
            svg = svg.replace(/<title\b[^>]*>[\s\S]*?<\/title>/gi, '').replace(/<desc\b[^>]*>[\s\S]*?<\/desc>/gi, '');
            svg = svg.replace(root[0], tag + '\n<title id="title">' + title + '</title>\n<desc id="desc">' + desc + '</desc>');
            if (/<script\b|<foreignObject\b|<image\b/i.test(svg)) throw new Error(name + ': unsafe or raster content');
            if (/(?:href|xlink:href)=(["'])(?:https?:|\/\/|data:image)/i.test(svg)) throw new Error(name + ': external or raster dependency');
            const bytes = Buffer.byteLength(svg, 'utf8');
            if (bytes > 320000) throw new Error(name + ': optimized SVG too large (' + bytes + ' bytes)');
            fs.writeFileSync(file, svg);
            console.log(name + ': ' + bytes + ' bytes; viewBox=' + viewBox.join(' '));
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/food-svg/ramen-tonkotsu.svg assets/food-svg/sushi-maki.svg assets/food-svg/panna-cotta.svg
          git commit -m "Remove letterboxing from detailed food SVG artwork"
          git push origin HEAD:fix/food-svg-padding-1.4.44
