name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build unsigned app archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Kuchnik.xcodeproj \
            -scheme Kuchnik \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kuchnik.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="build/Kuchnik.xcarchive/Products/Applications/Kuchnik.app"
          test -d "$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../Kuchnik-unsigned.ipa Payload
          unzip -l ../Kuchnik-unsigned.ipa | head -40
          test -s ../Kuchnik-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuchnik-unsigned-IPA
          path: build/Kuchnik-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
