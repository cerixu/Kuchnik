name: Build Kuchnik iOS IPA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-ipa.yml"
      - "ios/**"
      - "*.js"
      - "*.css"
      - "*.html"
      - "*.json"
      - "*.webmanifest"
      - "*.png"
      - "*.jpg"
      - "*.woff"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare offline web bundle
        run: |
          set -euo pipefail
          mkdir -p ios/www
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='qa' --exclude='tests' \
            --exclude='ios' --exclude='node_modules' --exclude='*.md' \
            ./ ios/www/
          test -s ios/www/index.html
          test -s ios/www/app.js

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Kuchnik.xcodeproj \
            -scheme Kuchnik \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
          APP="build/DerivedData/Build/Products/Release-iphoneos/Kuchnik.app"
          test -d "$APP"
          test -s "$APP/www/index.html"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          /usr/bin/zip -qry ../Kuchnik-unsigned.ipa Payload
          test -s ../Kuchnik-unsigned.ipa
          unzip -l ../Kuchnik-unsigned.ipa | head -30

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kuchnik-unsigned-IPA
          path: build/Kuchnik-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
