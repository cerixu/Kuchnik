name: Validate PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Syntax, imports and PWA consistency
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.js )
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "Checking syntax: $file"
            node --check --input-type=module < "$file"
          done

      - name: Run inventory matching regression tests
        run: node --experimental-default-type=module --test tests/*.test.mjs

      - name: Check local imports, service-worker cache and versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const problems = [];
          const files = fs.readdirSync('.').filter((name) => name.endsWith('.js'));
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const patterns = [
              /^[ \t]*import[ \t]+(?:[\s\S]*?[ \t]+from[ \t]*)?['"]([^'"]+)['"]/gm,
              /^[ \t]*export[ \t]+(?:\*|\{[\s\S]*?\})[ \t]+from[ \t]*['"]([^'"]+)['"]/gm,
              /\bimport\([ \t]*['"]([^'"]+)['"][ \t]*\)/g,
            ];
            for (const pattern of patterns) {
              for (const match of source.matchAll(pattern)) {
                const specifier = match[1];
                if (!specifier.startsWith('.')) continue;
                const target = path.resolve(path.dirname(path.resolve(file)), specifier);
                if (!fs.existsSync(target)) problems.push(`${file}: missing local import "${specifier}"`);
              }
            }
          }

          const sw = fs.readFileSync('sw.js', 'utf8');
          const util = fs.readFileSync('util.js', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const coreMatch = sw.match(/const CORE = \[([\s\S]*?)\];/);
          if (!coreMatch) problems.push('sw.js: CORE cache list not found');
          else {
            const core = [...coreMatch[1].matchAll(/['"]([^'"]+)['"]/g)].map((m) => m[1]);
            for (const asset of core) {
              if (asset === './') continue;
              if (!fs.existsSync(asset)) problems.push(`sw.js: cached asset missing from repository: ${asset}`);
            }
          }

          const photoModule = fs.readFileSync('food-photos.js', 'utf8');
          const photoFiles = [...photoModule.matchAll(/:\s*['"]([^'"]+\.jpg)['"]/g)].map((m) => m[1]);
          if (!photoFiles.length) problems.push('food-photos.js: no mapped photos found');
          for (const asset of photoFiles) {
            if (!fs.existsSync(asset)) problems.push(`food-photos.js: mapped photo missing from repository: ${asset}`);
          }

          // Sprawdź, czy każdy nazwany import rzeczywiście jest eksportowany przez moduł docelowy.
          const exportNames = (source) => {
            const names = new Set();
            for (const m of source.matchAll(/\bexport\s+(?:async\s+)?(?:function|class|const|let|var)\s+([A-Za-z_$][\w$]*)/g)) names.add(m[1]);
            for (const m of source.matchAll(/\bexport\s*\{([^}]+)\}/g)) {
              for (const raw of m[1].split(',')) {
                const parts = raw.trim().split(/\s+as\s+/);
                const name = (parts[1] || parts[0]).trim();
                if (/^[A-Za-z_$][\w$]*$/.test(name)) names.add(name);
              }
            }
            return names;
          };
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const imports = source.matchAll(/^\s*import\s*\{([\s\S]*?)\}\s*from\s*['"]([^'"]+)['"]/gm);
            for (const m of imports) {
              const specifier = m[2];
              if (!specifier.startsWith('.')) continue;
              const target = path.resolve(path.dirname(path.resolve(file)), specifier);
              if (!fs.existsSync(target)) continue;
              const names = exportNames(fs.readFileSync(target, 'utf8'));
              for (const raw of m[1].split(',')) {
                const imported = raw.replace(/\/\*[\s\S]*?\*\//g, '').trim().split(/\s+as\s+/)[0].trim();
                if (imported && !names.has(imported)) problems.push(`${file}: ${specifier} does not export "${imported}"`);
              }
            }
          }

          const changelog = fs.readFileSync('changelog.js', 'utf8');
          const appVersion = util.match(/APP_VERSION\s*=\s*['"]([^'"]+)['"]/)?.[1];
          const swVersion = sw.match(/const VERSION\s*=\s*['"]kucharzyna-([^'"]+)['"]/)?.[1];
          if (appVersion && !changelog.includes(`'${appVersion}'`)) problems.push(`changelog.js: release entry missing for ${appVersion}`);
          if (!appVersion) problems.push('util.js: APP_VERSION not found');
          if (!swVersion) problems.push('sw.js: VERSION not found');
          if (appVersion && swVersion && appVersion !== swVersion) {
            problems.push(`Version mismatch: APP_VERSION=${appVersion}, service worker=${swVersion}`);
          }
          if (manifest.display !== 'standalone') problems.push('manifest.webmanifest: display must be standalone');
          if (!Array.isArray(manifest.icons) || !manifest.icons.some((icon) => icon.purpose === 'maskable')) {
            problems.push('manifest.webmanifest: maskable icon missing');
          }
          if (!fs.readFileSync('index.html', 'utf8').includes('src="app.js"')) {
            problems.push('index.html: app.js module entry point missing');
          }

          if (problems.length) {
            console.error('Validation failed:\n- ' + problems.join('\n- '));
            process.exit(1);
          }
          console.log(`Validation passed: ${files.length} JavaScript modules, local imports, ${photoFiles.length} photo assets, ${appVersion} version sync, service-worker cache and manifest.`);
          NODE

      - name: Run inventory matching regression tests
        run: node --experimental-default-type=module --test qa/inventory-matching.test.mjs

      - name: Run backup safety regression test
        run: node --experimental-default-type=module --test qa/backup-safety.test.mjs

      - name: Run atomic shopping receipt regression test
        run: node --experimental-default-type=module --test qa/receive-shopping.test.mjs

      - name: Run barcode decoder regression tests
        run: node --experimental-default-type=module qa/barcode-smoke.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Smoke test startup and cooking flow
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kuchnik-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node qa/smoke-test.mjs
          node qa/indexeddb-recovery.mjs
          node qa/startup-deadline.mjs
          node qa/inventory-scanner-smoke.mjs
          node qa/offline-smoke.mjs
