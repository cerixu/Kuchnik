<!doctype html>
<html lang="pl" data-theme="dark" data-mode="pro">
<head>
  <meta charset="utf-8">
  <title>Kucharzyna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kucharzyna — prywatny notatnik szefa kuchni: receptury, przeliczanie, procenty piekarskie, food cost, zakupy. Działa offline.">

  <!-- Kolor paska systemowego (jasny / ciemny) -->
  <meta name="theme-color" content="#1d1d1f">
  <meta name="color-scheme" content="dark light">

  <!-- iOS: aplikacja na ekranie początkowym -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kucharzyna">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">

  <!-- Motyw ustawiany zanim pojawi się cokolwiek (brak błysku). Źródłem prawdy jest IndexedDB. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('k:theme'), m = localStorage.getItem('k:mode'), z = localStorage.getItem('k:tap'), s = localStorage.getItem('k:ts'), g = localStorage.getItem('k:glass'), tl = localStorage.getItem('k:tl');
        var d = document.documentElement;
        if (t) d.setAttribute('data-theme', t);
        if (m) d.setAttribute('data-mode', m);
        if (z) d.setAttribute('data-tap', z);
        if (s) d.style.setProperty('--ts', String(+s / 100));
        if (g) d.style.setProperty('--glass', String(+g / 100));
        if (tl) d.setAttribute('data-tablabels', tl);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav id="tabbar" aria-label="Główna nawigacja"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlays"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Kucharzyna wymaga włączonego JavaScriptu.</p></noscript>
  <div id="boot" class="boot" aria-hidden="true"><div class="boot-mark">👨‍🍳</div><div class="boot-name">Kucharzyna</div></div>
  <script>
    // Diagnostyka startu: błąd ładowania modułu lub zawieszony rozruch nie może zostawić samej animacji.
    (function () {
      var timer;
      function showBootError(message) {
        var boot = document.getElementById('boot');
        if (!boot || boot.dataset.recoveryShown === '1') return;
        boot.dataset.recoveryShown = '1';
        clearTimeout(timer);
        boot.setAttribute('aria-hidden', 'false');
        boot.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#171719;color:#f5f5f5;font:16px system-ui;text-align:center;gap:14px';
        boot.replaceChildren();
        var title = document.createElement('strong'); title.textContent = 'Kuchnik nie uruchomił się poprawnie';
        var detail = document.createElement('p'); detail.textContent = message || 'Uruchamianie trwa zbyt długo. Możliwe, że Safari zachowało starą wersję aplikacji.';
        var retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Odśwież aplikację'; retry.style.cssText = 'padding:14px 20px;border:0;border-radius:14px;background:#e4a66a;color:#171719;font:600 16px system-ui';
        retry.addEventListener('click', function () { location.reload(); });
        var help = document.createElement('p'); help.textContent = 'Nie usuwamy Twoich przepisów ani danych. Jeśli problem wróci, prześlij ten komunikat.';
        boot.append(title, detail, retry, help);
      }
      window.addEventListener('error', function (e) {
        if (document.getElementById('boot')) showBootError(e.message || 'Nie udało się załadować plików aplikacji.');
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (document.getElementById('boot')) showBootError(e.reason && e.reason.message ? e.reason.message : 'Błąd podczas uruchamiania danych.');
      });
      timer = setTimeout(function () {
        if (document.getElementById('boot')) showBootError('Aplikacja nie zakończyła startu w 15 sekund. Odśwież ją; jeśli nadal się zawiesza, przekaż nam ten ekran diagnostyczny.');
      }, 15000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
