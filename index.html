<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>ŻARŁOK</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ŻARŁOK — rysowany warsztat kucharza: receptury, kalkulatory, zakupy i inspiracje. Działa offline.">

  <!-- Kolor systemowego paska stanu -->
  <meta name="theme-color" content="#171719">
  <meta name="color-scheme" content="dark">

  <!-- iOS: aplikacja na ekranie początkowym -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ŻARŁOK">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="styles.css">

  <!-- Stały ciemny motyw aplikacji. -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        d.setAttribute('data-theme', 'dark');
        d.setAttribute('data-tablabels', 'on');
        var z = localStorage.getItem('k:tap'), s = localStorage.getItem('k:ts'), g = localStorage.getItem('k:glass');
        if (z) d.setAttribute('data-tap', z);
        if (s) d.style.setProperty('--ts', String(+s / 100));
        if (g) d.style.setProperty('--glass', String(+g / 100));
        localStorage.removeItem('k:theme');
        localStorage.removeItem('k:mode');
      } catch (e) {}
    })();
  </script></head>
<body>
  <div id="app">
    <main id="view" aria-live="polite"></main>
    <nav id="tabbar" aria-label="Główna nawigacja"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlays"></div>
  <noscript><p style="padding:24px;font:16px system-ui">ŻARŁOK wymaga włączonego JavaScriptu.</p></noscript>
  <div id="boot" class="boot" aria-hidden="true"><img class="boot-mark" src="icon-192.png" alt=""><div class="boot-name">ŻARŁOK</div><div class="boot-sub">Receptury · narzędzia · inspiracje</div></div>
  <script>
    // Diagnostyka startu: błąd ładowania modułu lub zawieszony rozruch nie może zostawić samej animacji.
    (function () {
      var timer, hardTimer;
      function showBootError(message) {
        var boot = document.getElementById('boot');
        if (!boot || boot.dataset.recoveryShown === '1') return;
        boot.dataset.recoveryShown = '1';
        clearTimeout(timer);
        clearTimeout(hardTimer);
        boot.setAttribute('aria-hidden', 'false');
        boot.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#171719;color:#f5f5f5;font:16px system-ui;text-align:center;gap:14px';
        boot.replaceChildren();
        var title = document.createElement('strong'); title.textContent = 'ŻARŁOK nie uruchomił się poprawnie';
        var detail = document.createElement('p'); detail.textContent = message || 'Uruchamianie trwa zbyt długo. Możliwe, że Safari zachowało starą wersję aplikacji.';
        var retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Odśwież aplikację'; retry.style.cssText = 'padding:14px 20px;border:0;border-radius:14px;background:#e4a66a;color:#171719;font:600 16px system-ui';
        retry.addEventListener('click', function () { location.reload(); });
        var help = document.createElement('p'); help.textContent = 'Nie usuwamy Twoich przepisów ani danych. Jeśli problem wróci, prześlij ten komunikat.';
        boot.append(title, detail, retry, help);
      }
      window.addEventListener('error', function (e) {
        // Błędy obrazów/fontów nie oznaczają awarii modułów aplikacji.
        // Duże moduły mogą ładować się dłużej niż dekoracyjna grafika startowa.
        if (e.target && e.target !== window && e.target.tagName &&
            e.target.tagName.toLowerCase() !== 'script') return;
        if (document.getElementById('boot') && !window.__kuchnikBootStarted) {
          var details = [];
          if (e.message) details.push(e.message);
          if (e.filename) details.push(e.filename + (e.lineno ? ':' + e.lineno : '') + (e.colno ? ':' + e.colno : ''));
          if (e.target && e.target.src) details.push('Nie udało się załadować: ' + e.target.src);
          showBootError(details.join(' · ') || 'Nie udało się załadować modułów aplikacji. Sprawdź konsolę Safari.');
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        if (document.getElementById('boot') && !window.__kuchnikBootStarted) {
          var reason = e.reason;
          showBootError(reason && (reason.stack || reason.message) ? (reason.stack || reason.message) : 'Błąd podczas ładowania modułów aplikacji.');
        }
      });
      // Szybka diagnostyka tylko wtedy, gdy moduł app.js w ogóle nie wystartował.
      timer = setTimeout(function () {
        if (document.getElementById('boot') && !window.__kuchnikBootStarted) {
          showBootError('Moduły aplikacji nie załadowały się w 15 sekund. Odśwież stronę; dane pozostają nietknięte.');
        }
      }, 15000);
      // Awaryjny watchdog; app.js ma własny limit pełnego rozruchu 60 s.
      hardTimer = setTimeout(function () {
        if (document.getElementById('boot')) {
          showBootError(window.__kuchnikBootStarted
            ? 'Rozruch nie zakończył się w 70 sekund. Odśwież aplikację; nie usuwaj danych witryny.'
            : 'Nie udało się załadować aplikacji w 70 sekund. Sprawdź połączenie i spróbuj ponownie.');
        }
      }, 70000);
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
