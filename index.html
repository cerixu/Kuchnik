<!doctype html>
<html lang="pl" data-theme="dark" data-mode="pro">
<head>
  <meta charset="utf-8">
  <title>Kuchnik</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kuchnik — prywatny notatnik szefa kuchni: receptury, kalkulatory, food cost, magazyn i zakupy. Działa offline.">
  <meta name="theme-color" content="#1d1d1f">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kuchnik">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="start-final.css">
  <link rel="stylesheet" href="visual-system.css">
  <link rel="stylesheet" href="kucharzyna-visual.css">
  <link rel="stylesheet" href="claude-completion.css">
  <link rel="stylesheet" href="visual-redesign.css">
  <link rel="stylesheet" href="generated-art.css">
  <link rel="stylesheet" href="zarlok-v2.css">
  <link rel="stylesheet" href="design-overhaul.css">
  <link rel="stylesheet" href="mobile-polish.css">
  <link rel="stylesheet" href="art-direction.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('k:theme'), m = localStorage.getItem('k:mode'), z = localStorage.getItem('k:tap'), s = localStorage.getItem('k:ts'), g = localStorage.getItem('k:glass'), tl = localStorage.getItem('k:tl');
        var d = document.documentElement;
        if (t) d.setAttribute('data-theme', t);
        if (m) d.setAttribute('data-mode', m);
        if (z) d.setAttribute('data-tap', z);
        if (s) d.style.setProperty('--ts', String(+s / 100));
        if (g) d.style.setProperty('--glass', String(+g / 100));
        if (tl) d.setAttribute('data-tablabels', tl);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="view" class="boot-shell" aria-live="polite">
      <div class="boot-shell-inner">
        <div class="boot-shell-mark" aria-hidden="true">👨‍🍳</div>
        <div class="boot-shell-name">Kuchnik</div>
        <div class="boot-shell-note">Przygotowuję notatnik…</div>
      </div>
    </main>
    <nav id="tabbar" aria-label="Główna nawigacja"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlays"></div>
  <noscript><p style="padding:24px;font:16px system-ui">Kuchnik wymaga włączonego JavaScriptu.</p></noscript>
  <script>
    (function () {
      var shown = false;
      function showError(message) {
        if (shown) return;
        shown = true;
        var view = document.getElementById('view');
        if (!view) return;
        view.className = '';
        var wrap = document.createElement('section');
        wrap.style.cssText = 'min-height:100%;display:grid;place-items:center;padding:28px;text-align:center;color:#f7f7f4';
        var inner = document.createElement('div');
        inner.style.cssText = 'max-width:330px';
        var title = document.createElement('h2');
        title.textContent = 'Kuchnik nie wystartował';
        title.style.cssText = 'font:600 24px system-ui;margin:0 0 10px';
        var desc = document.createElement('p');
        desc.textContent = 'Wystąpił błąd podczas uruchamiania aplikacji.';
        desc.style.cssText = 'color:rgba(247,247,244,.65);font:14px/1.5 system-ui';
        var detail = document.createElement('pre');
        detail.textContent = String(message || 'Nieznany błąd').slice(0, 1800);
        detail.style.cssText = 'white-space:pre-wrap;overflow:auto;max-height:180px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:12px;font:11px/1.45 ui-monospace';
        var retry = document.createElement('button');
        retry.textContent = 'Uruchom ponownie';
        retry.style.cssText = 'border:0;border-radius:999px;padding:13px 20px;background:#f7f7f4;color:#151515;font:600 14px system-ui';
        retry.addEventListener('click', function () { location.reload(); });
        inner.append(title, desc, detail, retry);
        wrap.append(inner);
        view.replaceChildren(wrap);
      }
      window.addEventListener('error', function (e) {
        var file = String(e && e.filename || '');
        if (/app\.js|views-|recipes\.js/.test(file)) showError((e.message || 'Błąd JavaScript') + (file ? '\\n' + file + ':' + (e.lineno || 0) : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        showError(r && (r.stack || r.message) || String(r || 'Nieobsłużony błąd Promise'));
      });
      window.setTimeout(function () {
        var view = document.getElementById('view');
        if (view && view.classList.contains('boot-shell')) showError('Aplikacja nie odpowiedziała podczas uruchamiania.');
      }, 10000);
    }());
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
