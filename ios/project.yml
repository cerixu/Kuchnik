name: Kuchnik
options:
  bundleIdPrefix: pl.cerixu
  deploymentTarget:
    iOS: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    PRODUCT_BUNDLE_IDENTIFIER: pl.cerixu.kuchnik
    INFOPLIST_KEY_CFBundleDisplayName: "Kuchnik"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Dodawanie zdjęć potraw do receptur."
    INFOPLIST_KEY_NSCameraUsageDescription: "Skanowanie kodów i fotografowanie produktów."
    GENERATE_INFOPLIST_FILE: YES
targets:
  Kuchnik:
    type: application
    platform: iOS
    sources:
      - path: Kuchnik
    resources:
      - path: www
    settings:
      base:
        PRODUCT_NAME: Kuchnik
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
